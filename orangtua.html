<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8B0000">
<title>Dashboard Orang Tua</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Poppins',sans-serif;font-size:17px}
.font-luxury{font-family:'Playfair Display',serif}
.tab-active{background:#8B0000;color:white}
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:12px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-red-900 text-white px-3 py-3 flex justify-between items-center shadow-md sticky top-0 z-40">
  <div class="flex items-center flex-1 min-w-0">
    <img src="images/logo-ez.png" class="h-11 mr-2 bg-white rounded p-1 flex-shrink-0" onerror="this.style.display='none'">
    <div class="min-w-0">
      <div class="font-extrabold text-lg leading-none">DASHBOARD ORTU</div>
      <div class="text-sm opacity-90 truncate" id="navNama">Loading...</div>
    </div>
  </div>
  <button onclick="logout()" class="bg-yellow-500 text-red-900 px-3 py-2 rounded-full font-extrabold text-sm flex-shrink-0 ml-2">LOGOUT</button>
</nav>

<div class="px-3 pt-3">
  <div class="bg-gradient-to-r from-red-900 to-red-700 text-white p-5 rounded-2xl shadow-lg">
    <div class="flex items-center mb-3">
      <div class="text-6xl mr-3">👨‍👩‍👧</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm opacity-90">Selamat datang,</div>
        <div class="font-extrabold text-xl truncate" id="profilNamaOrtu">-</div>
      </div>
    </div>
    <div class="bg-white/20 p-3 rounded-xl">
      <div class="text-sm opacity-90">Data Anak:</div>
      <div class="font-extrabold text-xl leading-tight" id="profilNamaAnak">-</div>
      <div class="text-sm mt-1" id="profilIDAnak">-</div>
    </div>
  </div>
</div>

<div class="px-3 mt-3">
  <div class="grid grid-cols-3 gap-2">
    <div class="bg-white p-4 rounded-2xl shadow text-center">
      <div class="text-3xl">📅</div>
      <div class="font-extrabold text-3xl text-red-900" id="totalJadwal">-</div>
      <div class="text-sm text-gray-600 font-semibold">Jadwal</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow text-center">
      <div class="text-3xl">✅</div>
      <div class="font-extrabold text-3xl text-green-600" id="totalPresensi">-</div>
      <div class="text-sm text-gray-600 font-semibold">Hadir</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow text-center">
      <div class="text-3xl">📊</div>
      <div class="font-extrabold text-3xl text-yellow-600" id="rataNilai">-</div>
      <div class="text-sm text-gray-600 font-semibold">Nilai</div>
    </div>
  </div>
</div>

<div class="px-3 mt-3">
  <div class="flex bg-white rounded-2xl shadow overflow-hidden mb-3">
    <button onclick="showTab('presensi')" id="tabPresensi" class="tab-active flex-1 py-4 font-extrabold text-base">✅ ABSEN</button>
    <button onclick="showTab('nilai')" id="tabNilai" class="flex-1 py-4 font-extrabold text-base text-gray-600">📊 NILAI</button>
    <button onclick="showTab('jadwal')" id="tabJadwal" class="flex-1 py-4 font-extrabold text-base text-gray-600">📅 JADWAL</button>
  </div>

  <div id="contentPresensi" class="bg-white rounded-2xl shadow p-4">
    <h3 class="font-extrabold text-xl text-red-900 mb-3 border-l-4 border-yellow-500 pl-3">Kehadiran Anak</h3>
    <div id="listPresensi" class="space-y-3"><div class="skeleton h-20"></div><div class="skeleton h-20"></div></div>
  </div>

  <div id="contentNilai" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="font-extrabold text-xl text-red-900 mb-3 border-l-4 border-yellow-500 pl-3">Nilai Anak</h3>
    <div id="listNilai" class="space-y-3"><div class="skeleton h-20"></div></div>
  </div>

  <div id="contentJadwal" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="font-extrabold text-xl text-red-900 mb-3 border-l-4 border-yellow-500 pl-3">Jadwal Anak</h3>
    <div id="listJadwal" class="space-y-3"><div class="skeleton h-20"></div></div>
  </div>
</div>

<div class="h-8"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzsWmRDZQnf680vmXKcF7s-BxDxXdelv3K6MWG0fRfqpxYv7azBWnldN6UrjUIqdvLG/exec";
let ortu=null;

window.onload = function() {
  const d = localStorage.getItem('ez_ortu');
  if(!d){alert('Login dulu!');window.location='index.html';return;}
  ortu = JSON.parse(d);
  document.getElementById('navNama').innerText = ortu.nama;
  document.getElementById('profilNamaOrtu').innerText = ortu.nama;
  document.getElementById('profilNamaAnak').innerText = ortu.namaSiswa;
  document.getElementById('profilIDAnak').innerText = 'ID: '+ortu.idSiswa;
  
  Promise.all([
    fetch(`${API_URL}?action=getPresensiSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getNilaiSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getJadwalSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json())
  ]).then(([pr,nl,jd]) => {
    renderPresensi(pr.data); document.getElementById('totalPresensi').innerText=pr.data.length;
    renderNilai(nl.data);
    const totalN = nl.data.reduce((s,x)=>s+(parseInt(x.nilai100)||0),0);
    document.getElementById('rataNilai').innerText = nl.data.length ? Math.round(totalN/nl.data.length) : '-';
    renderJadwal(jd.data); document.getElementById('totalJadwal').innerText=jd.data.length;
  });
};

function logout(){ if(confirm('Yakin logout?')){localStorage.removeItem('ez_ortu');window.location='index.html';} }

function showTab(tab) {
  ['presensi','nilai','jadwal'].forEach(t=>{
    const c=t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('content'+c).classList.add('hidden');
    document.getElementById('tab'+c).classList.remove('tab-active');
    document.getElementById('tab'+c).classList.add('text-gray-600');
  });
  const c=tab.charAt(0).toUpperCase()+tab.slice(1);
  document.getElementById('content'+c).classList.remove('hidden');
  document.getElementById('tab'+c).classList.add('tab-active');
  document.getElementById('tab'+c).classList.remove('text-gray-600');
}

function renderPresensi(d) {
  const el = document.getElementById('listPresensi');
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 text-lg">Anak belum presensi</p>';return;}
  el.innerHTML = d.map(x=>`
    <div class="flex items-center bg-green-50 p-4 rounded-xl border-l-4 border-green-500">
      <div class="text-4xl mr-3">✅</div>
      <div class="flex-1 min-w-0">
        <div class="font-extrabold text-lg truncate">${x.keterangan||'Kelas'}</div>
        <div class="text-base text-gray-700 font-semibold">${x.timestamp}</div>
        <div class="text-sm text-gray-500">${x.hari} • ${x.jam}</div>
      </div>
      <div class="text-sm bg-green-600 text-white px-3 py-1.5 rounded-full font-bold">${x.status}</div>
    </div>`).join('');
}

function renderNilai(d) {
  const el = document.getElementById('listNilai');
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 text-lg">Belum ada nilai</p>';return;}
  el.innerHTML = d.map(x=>{
    const n=parseInt(x.nilai100)||0;
    const w=n>=80?'green':n>=60?'yellow':'red';
    return `<div class="flex items-center bg-${w}-50 p-4 rounded-xl border-l-4 border-${w}-500">
      <div class="flex-1 min-w-0">
        <div class="font-extrabold text-lg truncate">${x.judulSoal}</div>
        <div class="text-base text-gray-600 font-semibold">${x.jenisQuiz}</div>
        <div class="text-sm text-gray-500">${x.keterangan||''}</div>
      </div>
      <div class="text-5xl font-extrabold text-${w}-600 ml-2">${n}</div>
    </div>`;
  }).join('');
}

function renderJadwal(d) {
  const el = document.getElementById('listJadwal');
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 text-lg">Belum ada jadwal</p>';return;}
  el.innerHTML = d.map(x=>`
    <div class="border-l-4 border-red-700 bg-red-50 p-4 rounded-r-xl">
      <div class="font-extrabold text-red-900 text-xl">${x.hari}</div>
      <div class="text-lg font-bold text-red-700">🕐 ${x.jam}</div>
      <div class="text-base text-gray-700 mt-1 font-semibold">${x.sesi}</div>
      <div class="text-sm text-gray-500 mt-1">📍 ${x.kelompok}</div>
    </div>`).join('');
}
</script>
</body>
</html>
