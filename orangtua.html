<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8B0000">
<title>Dashboard Ortu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html{font-size:20px}
body{margin:0;padding:0;font-family:'Poppins',sans-serif}
.font-luxury{font-family:'Playfair Display',serif}
.tab-active{background:#8B0000;color:white}
.txt-jumbo{font-size:2.2rem;line-height:1.1;font-weight:900}
.txt-huge{font-size:1.7rem;line-height:1.15;font-weight:800}
.txt-big{font-size:1.4rem;line-height:1.3;font-weight:700}
.txt-med{font-size:1.15rem;line-height:1.4;font-weight:600}
.txt-sml{font-size:1rem}
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:12px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* ==================================================
   UKURAN DASHBOARD ORANG TUA KHUSUS HP
================================================== */
@media screen and (max-width: 600px) {
  html {
    font-size: 14px !important;
  }

  body {
    font-size: 1rem !important;
  }

  nav {
    padding: 10px 12px !important;
  }

  nav img {
    height: 42px !important;
  }

  .txt-jumbo {
    font-size: 2rem !important;
    line-height: 1.12 !important;
  }

  .txt-huge {
    font-size: 1.55rem !important;
    line-height: 1.2 !important;
  }

  .txt-big {
    font-size: 1.2rem !important;
    line-height: 1.35 !important;
  }

  .txt-med {
    font-size: 1rem !important;
    line-height: 1.4 !important;
  }

  .txt-sml {
    font-size: 0.9rem !important;
  }

  #tabPresensi,
  #tabNilai,
  #tabJadwal {
    padding: 14px 4px !important;
    font-size: 1.05rem !important;
  }

  #contentPresensi,
  #contentNilai,
  #contentJadwal {
    padding: 14px !important;
  }
}

@media screen and (max-width: 360px) {
  html {
    font-size: 13px !important;
  }
}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-red-900 text-white px-3 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
  <div class="flex items-center flex-1 min-w-0">
    <img src="images/logo-ez.png" class="h-12 mr-2 bg-white rounded p-1 flex-shrink-0" onerror="this.style.display='none'">
    <div class="min-w-0">
      <div class="font-black leading-tight" style="font-size:1.3rem">DASHBOARD ORTU</div>
      <div class="txt-med opacity-90 truncate" id="navNama">Loading...</div>
    </div>
  </div>
  <button onclick="logout()" class="bg-yellow-500 text-red-900 px-4 py-3 rounded-full font-black flex-shrink-0 ml-2" style="font-size:1.05rem">LOGOUT</button>
</nav>

<div class="px-3 pt-3">
  <div class="bg-gradient-to-r from-red-900 to-red-700 text-white p-5 rounded-3xl shadow-lg">
    <div class="flex items-center mb-3">
      <div class="mr-3 flex items-center justify-center bg-white/20 rounded-2xl" style="min-width:80px;height:80px">
  <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
</div>
      <div class="flex-1 min-w-0">
        <div class="txt-med opacity-90">Selamat datang,</div>
        <div class="txt-huge truncate" id="profilNamaOrtu">-</div>
      </div>
    </div>
    <div class="bg-white/20 p-4 rounded-2xl">
      <div class="txt-med opacity-90">Data Anak:</div>
      <div class="txt-jumbo leading-tight" id="profilNamaAnak">-</div>
      <div class="txt-med mt-1" id="profilIDAnak">-</div>
    </div>
  </div>
</div>

<div class="px-3 mt-3">
  <div class="grid grid-cols-3 gap-2">
    <div class="bg-white p-4 rounded-2xl shadow text-center">
  <div class="mx-auto mb-1 bg-red-100 rounded-lg border-2 border-red-700 overflow-hidden" style="width:50px">
    <div class="bg-red-700 text-white font-black text-center" style="font-size:0.7rem;padding:2px">HARI INI</div>
    <div id="tglHariIni" class="font-black text-red-900 text-center" style="font-size:1.5rem;line-height:1">-</div>
    <div id="bulanHariIni" class="text-red-700 text-center font-bold" style="font-size:0.6rem;padding-bottom:2px">-</div>
  </div>
  <div class="font-black text-red-900" style="font-size:2.5rem" id="totalJadwal">-</div>
  <div class="txt-med text-gray-600">Jadwal</div>
</div>
    <div class="bg-white p-4 rounded-2xl shadow text-center">
      <div style="font-size:2.5rem">✅</div>
      <div class="font-black text-green-600" style="font-size:2.5rem" id="totalPresensi">-</div>
      <div class="txt-med text-gray-600">Hadir</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow text-center">
      <div style="font-size:2.5rem">📊</div>
      <div class="font-black text-yellow-600" style="font-size:2.5rem" id="rataNilai">-</div>
      <div class="txt-med text-gray-600">Nilai</div>
    </div>
  </div>
</div>

<div class="px-3 mt-3">
  <div class="flex bg-white rounded-2xl shadow overflow-hidden mb-3">
    <button onclick="showTab('presensi')" id="tabPresensi" class="tab-active flex-1 py-5 font-black txt-big">✅ KEHADIRAN</button>
    <button onclick="showTab('nilai')" id="tabNilai" class="flex-1 py-5 font-black txt-big text-gray-600">📊 NILAI</button>
    <button onclick="showTab('jadwal')" id="tabJadwal" class="flex-1 py-5 font-black txt-big text-gray-600">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px">
    <rect width="18" height="18" x="3" y="4" rx="2"/>
    <path d="M16 2v4M8 2v4M3 10h18"/>
  </svg>JADWAL
</button>
  </div>

  <div id="contentPresensi" class="bg-white rounded-2xl shadow p-4">

    <!-- INFORMASI PEMBAYARAN KHUSUS ORANG TUA -->
    <div class="bg-gradient-to-br from-red-900 to-red-700 text-white rounded-2xl p-4 shadow-lg mb-5">

      <div class="flex items-center mb-4">
        <div style="font-size:2.3rem" class="mr-3">💳</div>
        <div>
          <div class="txt-huge">INFORMASI PEMBAYARAN</div>
          <div class="txt-sml opacity-80">Ringkasan pembayaran kehadiran anak</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">

        <div class="bg-white/15 rounded-xl p-3 text-center">
          <div style="font-size:1.8rem">✅</div>
          <div id="jumlahSudahBayar" class="font-black" style="font-size:2rem">0</div>
          <div class="txt-sml">Sudah Dibayar</div>
        </div>

        <div class="bg-white/15 rounded-xl p-3 text-center">
          <div style="font-size:1.8rem">⏳</div>
          <div id="jumlahBelumBayar" class="font-black" style="font-size:2rem">0</div>
          <div class="txt-sml">Belum Dibayar</div>
        </div>

      </div>

      <div class="mt-3 bg-white text-red-900 rounded-xl p-4">

        <div class="flex justify-between items-center mb-2">
          <span class="txt-med">💰 Sudah Dibayar</span>
          <strong id="totalSudahBayar" class="txt-big">Rp0</strong>
        </div>

        <div class="border-t border-red-200 my-2"></div>

        <div class="flex justify-between items-center">
          <span class="txt-med font-black">🔴 Total Tagihan</span>
          <strong id="totalBelumBayar" class="font-black text-red-700" style="font-size:1.7rem">Rp0</strong>
        </div>

      </div>

    </div>

    <h3 class="txt-huge text-red-900 mb-4 border-l-4 border-yellow-500 pl-3">
      Kehadiran Anak
    </h3>
    <div id="listPresensi" class="space-y-3"><div class="skeleton h-24"></div><div class="skeleton h-24"></div></div>
  </div>

  <div id="contentNilai" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="txt-huge text-red-900 mb-4 border-l-4 border-yellow-500 pl-3">Nilai Anak</h3>
    <div id="listNilai" class="space-y-3"><div class="skeleton h-24"></div></div>
  </div>

  <div id="contentJadwal" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="txt-huge text-red-900 mb-4 border-l-4 border-yellow-500 pl-3">Jadwal Anak</h3>
    <div id="listJadwal" class="space-y-3"><div class="skeleton h-24"></div></div>
  </div>
</div>

<div class="h-6"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzsWmRDZQnf680vmXKcF7s-BxDxXdelv3K6MWG0fRfqpxYv7azBWnldN6UrjUIqdvLG/exec";
let ortu=null;

window.onload = function() {
  const d = localStorage.getItem('ez_ortu');
  if(!d){alert('Login dulu!');window.location='index.html';return;}
  ortu = JSON.parse(d);
    // Tampilkan tanggal hari ini di icon kalender
  const now = new Date();
  const bulanList = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGU','SEP','OKT','NOV','DES'];
  document.getElementById('tglHariIni').innerText = now.getDate();
  document.getElementById('bulanHariIni').innerText = bulanList[now.getMonth()];
  document.getElementById('navNama').innerText = ortu.nama;
  document.getElementById('profilNamaOrtu').innerText = ortu.nama;
  document.getElementById('profilNamaAnak').innerText = ortu.namaSiswa;
  document.getElementById('profilIDAnak').innerText = 'ID: '+ortu.idSiswa;
  
  Promise.all([
    fetch(`${API_URL}?action=getPresensiSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getNilaiSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getJadwalSiswa&idSiswa=${ortu.idSiswa}`).then(r=>r.json())
  ]).then(([pr,nl,jd]) => {
    renderPresensi(pr.data);

// HITUNG INFORMASI PEMBAYARAN KHUSUS ORANG TUA
hitungPembayaran(pr.data);

document.getElementById('totalPresensi').innerText=pr.data.length;
    renderNilai(nl.data);
    const totalN = nl.data.reduce((s,x)=>s+(parseInt(x.nilai100)||0),0);
    document.getElementById('rataNilai').innerText = nl.data.length ? Math.round(totalN/nl.data.length) : '-';
    renderJadwal(jd.data);
const namaHari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const hariIni = namaHari[new Date().getDay()];
const jadwalHariIni = jd.data.filter(x => (x.hari||'').trim().toLowerCase() === hariIni.toLowerCase());
document.getElementById('totalJadwal').innerText = jadwalHariIni.length;
  });
};

function logout(){ if(confirm('Yakin logout?')){localStorage.removeItem('ez_ortu');window.location='index.html';} }

function showTab(tab) {
  ['presensi','nilai','jadwal'].forEach(t=>{
    const c=t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('content'+c).classList.add('hidden');
    document.getElementById('tab'+c).classList.remove('tab-active');
    document.getElementById('tab'+c).classList.add('text-gray-600');
  });
  const c=tab.charAt(0).toUpperCase()+tab.slice(1);
  document.getElementById('content'+c).classList.remove('hidden');
  document.getElementById('tab'+c).classList.add('tab-active');
  document.getElementById('tab'+c).classList.remove('text-gray-600');
}

function formatRupiah(nilai){
  return 'Rp' + Number(nilai || 0).toLocaleString('id-ID');
}


function hitungPembayaran(data){

  let jumlahSudahBayar = 0;
  let jumlahBelumBayar = 0;

  let totalSudahBayar = 0;
  let totalBelumBayar = 0;


  data.forEach(item => {

    // Hanya hitung kehadiran HADIR
    if(String(item.status || '').toUpperCase() !== 'HADIR'){
      return;
    }

    const harga = Number(item.harga || 0);

    const statusBayar = String(
      item.statusPembayaran || 'Belum Bayar'
    ).trim().toLowerCase();


    if(
      statusBayar === 'sudah bayar' ||
      statusBayar === 'sudah dibayar' ||
      statusBayar === 'lunas'
    ){

      jumlahSudahBayar++;
      totalSudahBayar += harga;

    } else {

      jumlahBelumBayar++;
      totalBelumBayar += harga;

    }

  });


  document.getElementById('jumlahSudahBayar').innerText =
    jumlahSudahBayar + 'x';

  document.getElementById('jumlahBelumBayar').innerText =
    jumlahBelumBayar + 'x';

  document.getElementById('totalSudahBayar').innerText =
    formatRupiah(totalSudahBayar);

  document.getElementById('totalBelumBayar').innerText =
    formatRupiah(totalBelumBayar);

}

function renderPresensi(d) {

  const el = document.getElementById('listPresensi');

  if(!d || d.length === 0){

    el.innerHTML =
      '<p class="text-gray-400 text-center py-8 txt-big">Anak belum presensi</p>';

    return;

  }


  el.innerHTML = d.map(x => {

    const harga = Number(x.harga || 0);

    const statusBayar = String(
      x.statusPembayaran || 'Belum Bayar'
    ).trim();

    const sudahBayar =
      statusBayar.toLowerCase() === 'sudah bayar' ||
      statusBayar.toLowerCase() === 'sudah dibayar' ||
      statusBayar.toLowerCase() === 'lunas';


    const warnaBayar = sudahBayar
      ? 'green'
      : 'orange';


    const teksBayar = sudahBayar
      ? 'SUDAH DIBAYAR'
      : 'BELUM DIBAYAR';


    return `

    <div class="bg-green-50 p-4 rounded-xl border-l-4 border-green-500">

      <div class="flex items-center">

        <div style="font-size:3rem" class="mr-3">
          ✅
        </div>

        <div class="flex-1 min-w-0">

          <div class="txt-big truncate">
            ${x.keterangan || 'Kelas'}
          </div>

          <div class="txt-med text-gray-700">
            ${x.timestamp}
          </div>

          <div class="txt-sml text-gray-500 font-semibold">
            ${x.hari} • ${x.jam}
          </div>

        </div>

        <div class="txt-sml bg-green-600 text-white px-3 py-2 rounded-full font-black">
          ${x.status}
        </div>

      </div>


      <div class="mt-3 pt-3 border-t border-green-200">

        <div class="flex justify-between items-center">

          <div>

            <div class="txt-sml text-gray-500">
              Biaya Pertemuan
            </div>

            <div class="txt-big text-red-900">
              ${formatRupiah(harga)}
            </div>

          </div>


          <div class="text-right">

            <div class="txt-sml text-gray-500">
              Pembayaran
            </div>

            <div class="font-black px-3 py-2 rounded-full inline-block
              ${sudahBayar
                ? 'bg-green-100 text-green-700'
                : 'bg-orange-100 text-orange-700'}">

              ${sudahBayar ? '✅' : '⏳'}
              ${teksBayar}

            </div>

          </div>

        </div>

      </div>

    </div>

    `;

  }).join('');

}

function renderNilai(d) {
  const el = document.getElementById('listNilai');
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 txt-big">Belum ada nilai</p>';return;}
  el.innerHTML = d.map(x=>{
    const n=parseInt(x.nilai100)||0;
    const w=n>=80?'green':n>=60?'yellow':'red';
    return `<div class="flex items-center bg-${w}-50 p-4 rounded-xl border-l-4 border-${w}-500">
      <div class="flex-1 min-w-0">
        <div class="txt-big truncate">${x.judulSoal}</div>
        <div class="txt-med text-gray-600">${x.jenisQuiz}</div>
        <div class="txt-sml text-gray-500">${x.keterangan||''}</div>
      </div>
      <div class="font-black text-${w}-600 ml-2" style="font-size:3.5rem">${n}</div>
    </div>`;
  }).join('');
}

function renderJadwal(d) {
  const el = document.getElementById('listJadwal');
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 txt-big">Belum ada jadwal</p>';return;}
  el.innerHTML = d.map(x=>`
    <div class="border-l-4 border-red-700 bg-red-50 p-4 rounded-r-xl">
      <div class="txt-huge text-red-900">${x.hari}</div>
      <div class="txt-big text-red-700">🕐 ${x.jam}</div>
      <div class="txt-med text-gray-700 mt-1">${x.sesi}</div>
      <div class="txt-sml text-gray-500 mt-1 font-semibold">📍 ${x.kelompok}</div>
    </div>`).join('');
}
</script>
</body>
</html>
