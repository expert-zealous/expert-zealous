<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8B0000">
<title>Dashboard Siswa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html{font-size:20px}
body{margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
.font-luxury{font-family:'Playfair Display',serif}
.btn-red{background:linear-gradient(to right,#8B0000,#FF0000);color:white}
.tab-active{background:#8B0000;color:white}
.card-tap{transition:transform 0.15s}.card-tap:active{transform:scale(0.97)}

.txt-jumbo{font-size:2.2rem;line-height:1.1;font-weight:900}
.txt-huge{font-size:1.7rem;line-height:1.15;font-weight:800}
.txt-big{font-size:1.4rem;line-height:1.3;font-weight:700}
.txt-med{font-size:1.15rem;line-height:1.4;font-weight:600}
.txt-sml{font-size:1rem}

/* SCANNER */
#modalScan{position:fixed;inset:0;z-index:100;background:#000;display:none}
#modalScan.active{display:block}
#qr-reader{width:100vw !important;height:100vh !important;border:none !important;position:absolute !important;inset:0}
#qr-reader video{width:100vw !important;height:100vh !important;object-fit:cover !important}
#qr-reader__scan_region{background:transparent !important;min-height:100vh !important;padding:0 !important}
#qr-reader__scan_region>img,#qr-reader__scan_region canvas{display:none !important}
#qr-reader__dashboard{display:none !important}
#qr-reader div[style*="border"]{border:none !important;box-shadow:none !important}
#qr-shaded-region{display:none !important}

.scan-overlay{position:fixed;inset:0;z-index:101;pointer-events:none;display:flex;flex-direction:column}
.scan-header{background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent);padding:20px 20px 60px;color:white;pointer-events:auto}
.scan-frame-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.scan-frame{width:92vw;height:92vw;max-width:500px;max-height:500px;position:relative;box-shadow:0 0 0 9999px rgba(0,0,0,0.55)}
.scan-frame::before,.scan-frame::after,.scan-frame>span::before,.scan-frame>span::after{content:'';position:absolute;width:70px;height:70px;border:9px solid #FFD700}
.scan-frame::before{top:0;left:0;border-right:none;border-bottom:none;border-radius:20px 0 0 0}
.scan-frame::after{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 20px 0 0}
.scan-frame>span::before{content:'';position:absolute;bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 20px}
.scan-frame>span::after{content:'';position:absolute;bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 20px 0}
.scan-footer{background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);padding:50px 20px 30px;color:white;text-align:center;pointer-events:auto}

.spinner{border:3px solid #f3f3f3;border-top:3px solid #8B0000;border-radius:50%;width:26px;height:26px;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{100%{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:12px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ BADGE STATUS JADWAL ============ */
.badge{display:inline-block;padding:6px 14px;border-radius:9999px;font-weight:900;font-size:0.95rem;margin-top:8px}
.badge-hijau{background:#16a34a;color:white}
.badge-kuning{background:#eab308;color:#78350f;animation:blink 2s infinite}
.badge-merah{background:#dc2626;color:white}
@keyframes blink{50%{opacity:0.6}}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-red-900 text-white px-3 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
  <div class="flex items-center flex-1 min-w-0">
    <img src="images/logo-ez.png" class="h-12 mr-2 bg-white rounded p-1 flex-shrink-0" onerror="this.style.display='none'">
    <div class="min-w-0">
      <div class="font-black leading-tight" style="font-size:1.3rem">DASHBOARD</div>
      <div class="txt-med opacity-90 truncate" id="navNama">Loading...</div>
    </div>
  </div>
  <button onclick="logout()" class="bg-yellow-500 text-red-900 px-4 py-3 rounded-full font-black flex-shrink-0 ml-2" style="font-size:1.05rem">LOGOUT</button>
</nav>

<div class="px-3 pt-3">
  <div class="bg-gradient-to-r from-red-900 to-red-700 text-white p-5 rounded-3xl shadow-lg">
    <div class="flex items-center">
      <div style="font-size:5rem" class="mr-3">👨‍🎓</div>
      <div class="flex-1 min-w-0">
        <div class="txt-med opacity-90">Selamat datang,</div>
        <div class="txt-jumbo truncate" id="profilNama">-</div>
        <div class="txt-big mt-1" id="profilKelas">-</div>
      </div>
    </div>
  </div>
</div>

<div class="px-3 mt-3">
  <button onclick="openScanner()" class="card-tap w-full bg-gradient-to-r from-yellow-400 to-yellow-600 text-red-900 py-6 rounded-3xl shadow-lg flex items-center justify-center">
    <span style="font-size:5rem" class="mr-3">📷</span>
    <div class="text-left">
      <div class="txt-jumbo">SCAN QR</div>
      <div class="txt-med opacity-90">Ketuk untuk buka kamera</div>
    </div>
  </button>
</div>

<div class="px-3 mt-3">
  <div class="flex bg-white rounded-2xl shadow overflow-hidden mb-3">
    <button onclick="showTab('jadwal')" id="tabJadwal" class="tab-active flex-1 py-5 font-black txt-big">📅 JADWAL</button>
    <button onclick="showTab('presensi')" id="tabPresensi" class="flex-1 py-5 font-black txt-big text-gray-600">✅ ABSEN</button>
    <button onclick="showTab('nilai')" id="tabNilai" class="flex-1 py-5 font-black txt-big text-gray-600">📊 NILAI</button>
  </div>

  <div id="contentJadwal" class="bg-white rounded-2xl shadow p-4">
    <h3 class="txt-huge text-red-900 mb-3 border-l-4 border-yellow-500 pl-3">Jadwal Les Saya</h3>
    <!-- LEGENDA WARNA -->
    <div class="flex flex-wrap gap-2 mb-4 text-xs">
      <span class="badge badge-hijau" style="font-size:0.85rem;padding:4px 10px">✓ Sudah Absen</span>
      <span class="badge badge-kuning" style="font-size:0.85rem;padding:4px 10px">⏰ Hari Ini</span>
      <span class="badge badge-merah" style="font-size:0.85rem;padding:4px 10px">○ Belum</span>
    </div>
    <div id="listJadwal" class="space-y-3">
      <div class="skeleton h-24"></div><div class="skeleton h-24"></div>
    </div>
  </div>

  <div id="contentPresensi" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="txt-huge text-red-900 mb-4 border-l-4 border-yellow-500 pl-3">Riwayat Presensi</h3>
    <div id="listPresensi" class="space-y-3"><div class="skeleton h-24"></div><div class="skeleton h-24"></div></div>
  </div>

  <div id="contentNilai" class="hidden bg-white rounded-2xl shadow p-4">
    <h3 class="txt-huge text-red-900 mb-4 border-l-4 border-yellow-500 pl-3">Nilai Quiz Saya</h3>
    <div id="listNilai" class="space-y-3"><div class="skeleton h-24"></div><div class="skeleton h-24"></div></div>
  </div>
</div>

<div class="h-6"></div>

<div id="modalScan">
  <div id="qr-reader"></div>
  <div class="scan-overlay">
    <div class="scan-header flex justify-between items-center">
      <div>
        <div class="font-black" style="font-size:1.8rem">📷 Scan QR</div>
        <div class="txt-big opacity-90 mt-1">Arahkan ke QR Code</div>
      </div>
      <button onclick="closeScanner()" class="bg-white/30 backdrop-blur w-16 h-16 rounded-full font-black" style="font-size:2rem">✕</button>
    </div>
    <div class="scan-frame-wrap"><div class="scan-frame"><span></span></div></div>
    <div class="scan-footer">
      <div class="txt-big font-bold mb-4">Posisikan QR dalam kotak kuning</div>
      <button onclick="closeScanner()" class="bg-white text-red-900 px-12 py-4 rounded-full font-black" style="font-size:1.4rem">TUTUP</button>
    </div>
  </div>
</div>

<div id="modalNotif" class="hidden fixed inset-0 bg-black/85 z-[200] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-7 w-full max-w-md text-center">
    <div id="notifIcon" style="font-size:6rem" class="mb-3">✅</div>
    <div id="notifTitle" class="font-black text-red-900 mb-2" style="font-size:2rem">Berhasil!</div>
    <div id="notifMsg" class="text-gray-700 mb-4 txt-big">-</div>
    <div id="notifDetail" class="bg-yellow-50 p-4 rounded-xl txt-med mb-4 text-gray-800"></div>
    <button onclick="closeNotif()" class="w-full btn-red py-5 rounded-full font-black" style="font-size:1.5rem">OK</button>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzsWmRDZQnf680vmXKcF7s-BxDxXdelv3K6MWG0fRfqpxYv7azBWnldN6UrjUIqdvLG/exec";
const HARI_LIST = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
let siswa=null, html5QrCode=null;
let cacheJadwal=[], cachePresensi=[], cacheNilai=[];

window.onload = function() {
  const data = localStorage.getItem('ez_siswa');
  if(!data){alert('Login dulu!');window.location='index.html';return;}
  siswa = JSON.parse(data);
  document.getElementById('navNama').innerText = siswa.nama;
  document.getElementById('profilNama').innerText = siswa.nama;
  document.getElementById('profilKelas').innerText = siswa.kelas + ' • ' + siswa.id;
  
  loadAll();
  
  if(location.search.includes('autoscan=1')) setTimeout(openScanner, 400);
};

function loadAll() {
  Promise.all([
    fetch(`${API_URL}?action=getJadwalSiswa&idSiswa=${siswa.id}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getPresensiSiswa&idSiswa=${siswa.id}`).then(r=>r.json()),
    fetch(`${API_URL}?action=getNilaiSiswa&idSiswa=${siswa.id}`).then(r=>r.json())
  ]).then(([jd,pr,nl]) => {
    cacheJadwal = jd.data; 
    cachePresensi = pr.data; 
    cacheNilai = nl.data;
    renderJadwal();  // render jadwal butuh data presensi
    renderPresensi();
    renderNilai();
  }).catch(e=>console.log(e));
}

function logout(){ if(confirm('Yakin logout?')){localStorage.removeItem('ez_siswa');window.location='index.html';} }

function showTab(tab) {
  ['jadwal','presensi','nilai'].forEach(t=>{
    const c=t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('content'+c).classList.add('hidden');
    document.getElementById('tab'+c).classList.remove('tab-active');
    document.getElementById('tab'+c).classList.add('text-gray-600');
  });
  const c=tab.charAt(0).toUpperCase()+tab.slice(1);
  document.getElementById('content'+c).classList.remove('hidden');
  document.getElementById('tab'+c).classList.add('tab-active');
  document.getElementById('tab'+c).classList.remove('text-gray-600');
}

// ============ CEK STATUS JADWAL BERDASARKAN PRESENSI HARI INI ============
function cekStatusJadwal(jadwal) {
  const now = new Date();
  const hariIni = HARI_LIST[now.getDay()];
  const tglIni = String(now.getDate()).padStart(2,'0') + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear();
  
  const isHariIni = (jadwal.hari === hariIni);
  
  // Cek apakah SUDAH ada presensi HARI INI dengan hari & jam awal yang cocok
  let sudahAbsen = false;
  cachePresensi.forEach(p => {
    const tglPresensi = p.timestamp.substring(0,10);
    if(tglPresensi === tglIni && p.hari === jadwal.hari) {
      // Ambil jam awal jadwal dari string "12.30 - 14.00"
      const jamJadwal = jadwal.jam.split('-')[0].trim().replace(/[.:]/g,'');
      // Cek keterangan presensi ada jam jadwalnya (kita catat di keterangan format "TKA Matematika (12.30 - 14.00)")
      if(p.keterangan && p.keterangan.includes(jadwal.jam.trim())) {
        sudahAbsen = true;
      }
    }
  });
  
  if(sudahAbsen) return 'hijau';
  if(isHariIni) return 'kuning';
  return 'merah';
}
function renderJadwal() {
  const el = document.getElementById('listJadwal');
  const d = cacheJadwal;
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 txt-big">Belum ada jadwal</p>';return;}
  
  el.innerHTML = d.map(x=>{
    const status = cekStatusJadwal(x);
    let bgClass, borderClass, textColor, badge;
    
    if(status === 'hijau') {
      bgClass = 'bg-green-50';
      borderClass = 'border-green-600';
      textColor = 'text-green-900';
      badge = '<span class="badge badge-hijau">✓ SUDAH ABSEN</span>';
    } else if(status === 'kuning') {
      bgClass = 'bg-yellow-50';
      borderClass = 'border-yellow-500';
      textColor = 'text-yellow-900';
      badge = '<span class="badge badge-kuning">⏰ KELAS HARI INI</span>';
    } else {
      bgClass = 'bg-red-50';
      borderClass = 'border-red-700';
      textColor = 'text-red-900';
      badge = '<span class="badge badge-merah">○ Belum Absen</span>';
    }
    
    return `
    <div class="border-l-4 ${borderClass} ${bgClass} p-4 rounded-r-xl">
      <div class="txt-huge ${textColor}">${x.hari}</div>
      <div class="txt-big ${textColor} opacity-80">🕐 ${x.jam}</div>
      <div class="txt-med text-gray-700 mt-1">${x.sesi}</div>
      <div class="txt-sml text-gray-500 mt-1 font-semibold">📍 ${x.kelompok}</div>
      ${badge}
    </div>`;
  }).join('');
}

function renderPresensi() {
  const el = document.getElementById('listPresensi');
  const d = cachePresensi;
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 txt-big">Belum ada presensi</p>';return;}
  el.innerHTML = d.map(x=>`
    <div class="flex items-center bg-green-50 p-4 rounded-xl border-l-4 border-green-500">
      <div style="font-size:3rem" class="mr-3">✅</div>
      <div class="flex-1 min-w-0">
        <div class="txt-big truncate">${x.keterangan||'Kelas'}</div>
        <div class="txt-med text-gray-700">${x.timestamp}</div>
        <div class="txt-sml text-gray-500 font-semibold">${x.hari} • ${x.jam}</div>
      </div>
      <div class="txt-sml bg-green-600 text-white px-3 py-2 rounded-full font-black">${x.status}</div>
    </div>`).join('');
}

function renderNilai() {
  const el = document.getElementById('listNilai');
  const d = cacheNilai;
  if(!d||d.length===0){el.innerHTML='<p class="text-gray-400 text-center py-8 txt-big">Belum ada nilai</p>';return;}
  el.innerHTML = d.map(x=>{
    const n=parseInt(x.nilai100)||0;
    const w=n>=80?'green':n>=60?'yellow':'red';
    return `<div class="flex items-center bg-${w}-50 p-4 rounded-xl border-l-4 border-${w}-500">
      <div class="flex-1 min-w-0">
        <div class="txt-big truncate">${x.judulSoal}</div>
        <div class="txt-med text-gray-600">${x.jenisQuiz}</div>
        <div class="txt-sml text-gray-500">${x.keterangan||''}</div>
      </div>
      <div class="font-black text-${w}-600 ml-2" style="font-size:3.5rem">${n}</div>
    </div>`;
  }).join('');
}

function openScanner() {
  document.getElementById('modalScan').classList.add('active');
  document.body.style.overflow='hidden';
  html5QrCode = new Html5Qrcode("qr-reader", {verbose:false});
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: undefined, disableFlip: false },
    onScanSuccess,
    ()=>{}
  ).catch(err => { alert('Gagal buka kamera! Cek izin kamera.'); closeScanner(); });
}

function closeScanner() {
  if(html5QrCode){ html5QrCode.stop().catch(()=>{}); html5QrCode=null; }
  document.getElementById('modalScan').classList.remove('active');
  document.body.style.overflow='';
}

async function onScanSuccess(kodeQR) {
  if(html5QrCode){ await html5QrCode.stop().catch(()=>{}); html5QrCode=null; }
  document.getElementById('modalScan').classList.remove('active');
  document.body.style.overflow='';
  if(navigator.vibrate) navigator.vibrate(200);
  
  showNotif('⏳','Memproses...','Mengirim data','');
  try {
    const r = await fetch(`${API_URL}?action=scanQR&idSiswa=${siswa.id}&kodeQR=${encodeURIComponent(kodeQR)}`);
    const j = await r.json();
    if(j.status==='success'){
      showNotif('✅','BERHASIL!', j.namaSiswa, `📅 ${j.hari} • 🕐 ${j.jam}<br>📚 ${j.mapel}`);
      loadAll();
    } else if(j.status==='warning'){ 
      showNotif('⚠️','Sudah Presensi', j.message, ''); 
    } else { 
      // Tampilkan pesan error dengan line breaks
      const pesan = j.message.replace(/\n/g, '<br>');
      showNotif('❌','QR Ditolak', '', pesan); 
    }
  } catch(e){ showNotif('❌','Error','Gagal koneksi',''); }
}
function showNotif(icon,title,msg,detail) {
  document.getElementById('notifIcon').innerText=icon;
  document.getElementById('notifTitle').innerText=title;
  document.getElementById('notifMsg').innerHTML=msg; // ganti innerText → innerHTML supaya bisa <br>
  document.getElementById('notifDetail').innerHTML=detail;
  document.getElementById('notifDetail').style.display=detail?'block':'none';
  document.getElementById('modalNotif').classList.remove('hidden');
}
  function closeNotif(){ document.getElementById('modalNotif').classList.add('hidden'); }
</script>
</body>
</html>
